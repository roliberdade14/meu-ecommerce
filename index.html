<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>[NOME DA LOJA]</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    /* Página de entrada: liga as duas versões do site */
    :root { --brand: #1E55D6; --brand-dark: #163FA6; --ink: #111827; --muted: #5B6270; --line: #E3E5E9; --surface: #F1F2F4; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; font-family: Inter, system-ui, sans-serif; color: var(--ink); background: var(--surface); }
    main { width: 100%; max-width: 760px; }
    h1 { font-family: Poppins, system-ui, sans-serif; font-size: clamp(26px, 5vw, 36px); margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 28px; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    a.card { display: block; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 24px; color: inherit; text-decoration: none; transition: box-shadow .2s, transform .2s; }
    a.card:hover { box-shadow: 0 16px 40px rgba(17,24,39,.10); transform: translateY(-2px); }
    a.card:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
    h2 { font-family: Poppins, system-ui, sans-serif; font-size: 20px; margin: 0 0 6px; color: var(--brand); }
    .card p { margin: 0; }
    @media (prefers-reduced-motion: reduce) { a.card { transition: none; } }
  </style>
</head>
<body>
  <main>
    <h1>[NOME DA LOJA]</h1>
    <p>Escolha qual versão do site você quer ver.</p>
    <div class="grid">
      <a class="card" href="landing/"><h2>Landing page</h2><p>Página de conversão com WhatsApp e formulário.</p></a>
      <a class="card" href="loja/"><h2>Página inicial da loja</h2><p>Vitrine com ofertas do dia, categorias e produtos.</p></a>
    </div>
  </main>
</body>
</html>
